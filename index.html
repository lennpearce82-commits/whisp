<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WHISP Steganography</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤫</text></svg>">
  <style>
    body { margin: 0; background-color: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; }
    #app-content { display: none; padding: 2rem; text-align: center; }
  </style>
</head>
<body>

<!-- Lock Overlay -->
<div id="auth-overlay" style="position:fixed;top:0;left:0;width:100vw;height:100vh;background:#0f172a;display:flex;align-items:center;justify-content:center;z-index:999999;">
  <div style="background:#1e293b;padding:2rem;border-radius:1rem;width:90%;max-width:360px;text-align:center;box-shadow:0 10px 25px rgba(0,0,0,0.5);">
    <img src="./whisplogo256x256.png" alt="WHISP Logo" style="width:70px;height:70px;margin-bottom:1rem;">
    <h2 style="margin:0 0 0.5rem 0;color:#38bdf8;">WHISP Security</h2>
    <p style="font-size:0.875rem;color:#94a3b8;margin-bottom:1.25rem;">Enter passphrase to unlock application</p>
    
    <form onsubmit="verifyPassphrase(event)">
      <input type="password" id="auth-passphrase" autocomplete="current-password" autocomplete="current-password" placeholder="Passphrase..." style="width:100%;padding:0.75rem;border-radius:0.5rem;border:1px solid #334155;background:#0f172a;color:#fff;margin-bottom:1rem;box-sizing:border-box;outline:none;">
      <button type="submit" style="width:100%;padding:0.75rem;border-radius:0.5rem;border:none;background:#0284c7;color:#fff;font-weight:bold;cursor:pointer;">Unlock WHISP</button>
    </form>
    
    <p id="auth-error" style="color:#ef4444;font-size:0.875rem;margin-top:1rem;display:none;">Invalid Passphrase</p>
  </div>
</div>

<script>
// SHA-256 hash of "change-this-passphrase"
const TARGET_HASH = "8403247008339890f3b1131e6e5bb4dca71d5898b890b8b625c975dee24a8bc1";

async function verifyPassphrase(e) {
  if (e) e.preventDefault();
  const input = document.getElementById("auth-passphrase").value.trim();
  const errorEl = document.getElementById("auth-error");
  
  // Compute SHA-256
  const encoder = new TextEncoder();
  const data = encoder.encode(input);
  const hashBuffer = await crypto.subtle.digest("SHA-256", data);
  const computedHash = Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, "0")).join("");

  console.log("Input:", input);
  console.log("Computed Hash:", computedHash);

  if (computedHash === TARGET_HASH) {
    sessionStorage.setItem("whisp_authenticated", "true");
    document.getElementById("auth-overlay").style.display = "none";
    document.getElementById("app-content").style.display = "block";
  } else {
    errorEl.style.display = "block";
  }
}

// Check on initial page load
if (sessionStorage.getItem("whisp_authenticated") === "true") {
  document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("auth-overlay").style.display = "none";
    document.getElementById("app-content").style.display = "block";
  });
}
</script>

<div id="app-content">
  <div style="max-width: 600px; margin: 0 auto; text-align: left; background: #1e293b; padding: 2rem; border-radius: 1rem; box-shadow: 0 10px 25px rgba(0,0,0,0.3);">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; border-bottom: 1px solid #334155; padding-bottom: 1rem;">
      <h1 style="margin: 0; font-size: 1.5rem; color: #38bdf8; display: flex; align-items: center; gap: 0.5rem;">
        <img src="./whisplogo256x256.png" style="width: 32px; height: 32px;"> WHISP Steganography
      </h1>
      <button onclick="lockApp()" style="background: #334155; color: #94a3b8; border: none; padding: 0.4rem 0.8rem; border-radius: 0.375rem; cursor: pointer; font-size: 0.875rem;">Lock</button>
    </div>

    <!-- Encode Section -->
    <div style="margin-bottom: 2rem;">
      <label style="display: block; font-weight: bold; margin-bottom: 0.5rem; color: #f8fafc;">Cover Text / Emoji (Visible)</label>
      <input type="text" id="cover-text" value="🤫 Nothing to see here..." style="width: 100%; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid #334155; background: #0f172a; color: #fff; margin-bottom: 1rem; box-sizing: border-box; outline: none;">

      <label style="display: block; font-weight: bold; margin-bottom: 0.5rem; color: #f8fafc;">Secret Payload (Hidden)</label>
      <textarea id="secret-payload" placeholder="Enter secret message to conceal..." rows="3" style="width: 100%; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid #334155; background: #0f172a; color: #fff; margin-bottom: 1rem; box-sizing: border-box; outline: none; resize: vertical;"></textarea>

      <button onclick="encodeStego()" style="width: 100%; padding: 0.75rem; border-radius: 0.5rem; border: none; background: #0284c7; color: #fff; font-weight: bold; cursor: pointer;">Hide Message in Cover Text</button>
      
      <div id="encode-output-container" style="display: none; margin-top: 1rem;">
        <label style="display: block; font-weight: bold; margin-bottom: 0.5rem; color: #4ade80;">Steganographic Output (Ready to copy):</label>
        <textarea id="encode-output" readonly rows="3" style="width: 100%; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid #22c55e; background: #0f172a; color: #fff; box-sizing: border-box; outline: none;"></textarea>
        <button onclick="copyOutput()" style="margin-top: 0.5rem; background: #22c55e; color: #000; font-weight: bold; border: none; padding: 0.5rem 1rem; border-radius: 0.375rem; cursor: pointer;">Copy to Clipboard</button>
      </div>
    </div>

    <hr style="border: 0; border-top: 1px solid #334155; margin: 2rem 0;">

    <!-- Decode Section -->
    <div>
      <label style="display: block; font-weight: bold; margin-bottom: 0.5rem; color: #f8fafc;">Paste Steganographic Text to Reveal</label>
      <textarea id="decode-input" placeholder="Paste text containing hidden zero-width payload..." rows="3" style="width: 100%; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid #334155; background: #0f172a; color: #fff; margin-bottom: 1rem; box-sizing: border-box; outline: none; resize: vertical;"></textarea>
      
      <button onclick="decodeStego()" style="width: 100%; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid #38bdf8; background: transparent; color: #38bdf8; font-weight: bold; cursor: pointer;">Extract Hidden Secret</button>
      
      <div id="decode-output-container" style="display: none; margin-top: 1rem; padding: 1rem; background: #0f172a; border-radius: 0.5rem; border: 1px solid #38bdf8;">
        <label style="display: block; font-size: 0.875rem; color: #94a3b8; margin-bottom: 0.25rem;">Revealed Secret Message:</label>
        <div id="decode-output" style="font-size: 1.125rem; font-weight: bold; color: #38bdf8; word-break: break-all;"></div>
      </div>
    </div>
  </div>
</div>

<script>
// Zero-Width Steganography Engine
const ZWC = {
  ​: "0", // Zero-width space
  ‌: "1"  // Zero-width non-joiner
};
const REVERSE_ZWC = {
  "0": "​",
  "1": "‌"
};

function textToBinary(text) {
  return text.split("").map(char => char.charCodeAt(0).toString(2).padStart(8, "0")).join("");
}

function binaryToText(binary) {
  const bytes = binary.match(/.{1,8}/g) || [];
  return bytes.map(byte => String.fromCharCode(parseInt(byte, 2))).join("");
}

function encodeStego() {
  const cover = document.getElementById("cover-text").value;
  const secret = document.getElementById("secret-payload").value;
  if (!secret) return alert("Please enter a secret message to conceal.");

  const binary = textToBinary(secret);
  const hiddenZwc = binary.split("").map(bit => REVERSE_ZWC[bit]).join("");

  const stegoText = cover + hiddenZwc;
  document.getElementById("encode-output").value = stegoText;
  document.getElementById("encode-output-container").style.display = "block";
}

function copyOutput() {
  const output = document.getElementById("encode-output");
  output.select();
  document.execCommand("copy");
  alert("Steganographic payload copied to clipboard!");
}

function decodeStego() {
  const input = document.getElementById("decode-input").value;
  let binary = "";

  for (let char of input) {
    if (ZWC[char]) {
      binary += ZWC[char];
    }
  }

  const container = document.getElementById("decode-output-container");
  const outputEl = document.getElementById("decode-output");

  if (binary.length > 0 && binary.length % 8 === 0) {
    outputEl.textContent = binaryToText(binary);
    container.style.display = "block";
  } else {
    outputEl.textContent = "No hidden payload found in input text.";
    container.style.display = "block";
  }
}

function lockApp() {
  sessionStorage.removeItem("whisp_authenticated");
  location.reload();
}
</script>

</body>
</html>
