<!-- Client-Side AES Passphrase Gateway -->
<div id="auth-overlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#0f172a;color:#f8fafc;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;font-family:sans-serif;">
  <div style="background:#1e293b;padding:2.5rem;border-radius:1rem;box-shadow:0 10px 25px -5px rgba(0,0,0,0.5);width:90%;max-width:400px;text-align:center;">

    <h2 style="margin:0 0 0.5rem 0;color:#38bdf8;">WHISP Security</h2>
    <p style="font-size:0.875rem;color:#94a3b8;margin-bottom:1.5rem;">Enter passphrase to unlock application</p>
    <input type="password" id="auth-passphrase" placeholder="Passphrase..." style="width:100%;padding:0.75rem;border-radius:0.5rem;border:1px solid #334155;background:#0f172a;color:#fff;margin-bottom:1rem;box-sizing:border-box;font-size:1rem;outline:none;">
    <button id="auth-btn" onclick="verifyPassphrase()" style="width:100%;padding:0.75rem;border-radius:0.5rem;border:none;background:#0284c7;color:#fff;font-weight:bold;cursor:pointer;font-size:1rem;">Unlock WHISP</button>
    <p id="auth-error" style="color:#ef4444;font-size:0.875rem;margin-top:1rem;display:none;">Invalid Passphrase</p>
  </div>
</div>

<script>
// SHA-256 hash of "change-this-passphrase"
const TARGET_HASH = "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918";

async function hashPassphrase(passphrase) {
  const encoder = new TextEncoder();
  const data = encoder.encode(passphrase);
  const hashBuffer = await crypto.subtle.digest("SHA-256", data);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
}

async function verifyPassphrase() {
  const input = document.getElementById("auth-passphrase").value;
  const errorEl = document.getElementById("auth-error");
  const computedHash = await hashPassphrase(input);
  
  if (computedHash === TARGET_HASH) {
    sessionStorage.setItem("whisp_authenticated", "true");
    document.getElementById("auth-overlay").style.display = "none";
  } else {
    errorEl.style.display = "block";
  }
}

window.addEventListener("DOMContentLoaded", () => {
  if (sessionStorage.getItem("whisp_authenticated") === "true") {
    document.getElementById("auth-overlay").style.display = "none";
  }
});
</script>


<div class="container">
  <div class="card">
    <h2>1. Hide Message</h2>

    <button onclick="revealMessage()">Extract Hidden Text</button>
    
    <label style="margin-top: 1rem;">Revealed Secret:</label>
    <div id="decodeOutput" class="output-box"></div>
  </div>
</div>

<script>
  const ZW_ZERO = '\u200B';
  const ZW_ONE  = '\u200C';
  const ZW_DELIM = '\u200D';

  function textToZeroWidth(text) {
    return text.split('')
      .map(char => char.charCodeAt(0).toString(2).padStart(8, '0'))
      .join('')
      .split('')
      .map(bit => (bit === '0' ? ZW_ZERO : ZW_ONE))
      .join('') + ZW_DELIM;
  }

  function zeroWidthToText(zwStr) {
    const zwData = zwStr.split(ZW_DELIM)[0];
    if (!zwData) return '';

    let binary = '';
    for (const char of zwData) {
      if (char === ZW_ZERO) binary += '0';
      else if (char === ZW_ONE) binary += '1';
    }

    let text = '';
    for (let i = 0; i < binary.length; i += 8) {
      const byte = binary.slice(i, i + 8);
      if (byte.length === 8) {
        text += String.fromCharCode(parseInt(byte, 2));
      }
    }
    return text;
  }

  function hideMessage() {
    const cover = document.getElementById('coverEmojis').value || '👁️';
    const secret = document.getElementById('secretText').value;
    
    if (!secret) {
      alert('Please enter a secret message to hide.');
      return;
    }

    const hiddenPayload = textToZeroWidth(secret);
    const emojiArray = Array.from(cover);
    const result = emojiArray[0] + hiddenPayload + emojiArray.slice(1).join('');

    const outputDiv = document.getElementById('encodeOutput');
    outputDiv.innerText = result;

    navigator.clipboard.writeText(result);
    alert('Encoded emojis copied to clipboard!');
  }

  function revealMessage() {
    const input = document.getElementById('stegoInput').value;
    const extractedText = zeroWidthToText(input);

    const outputDiv = document.getElementById('decodeOutput');
    if (extractedText) {
      outputDiv.innerText = extractedText;
      outputDiv.style.color = '#38bdf8';
    } else {
      outputDiv.innerText = 'No hidden message detected.';
      outputDiv.style.color = '#ef4444';
    }
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js');
    });
  }
</script>
